<div class="chat-input-panel" [class.drag-active]="isDraggingFile">
  @if (isDraggingFile) {
    <div class="drop-hint">Suelta el archivo para adjuntarlo</div>
  }

  @if (attachedFileViews.length > 0) {
    <div class="attachment-list">
      @for (file of attachedFileViews; track file.id) {
        <div class="attachment-chip">
          @if (isImage(file) && file.previewUrl) {
            <img class="attachment-preview" [src]="file.previewUrl" [alt]="file.name">
          } @else {
            <span class="attachment-file-icon">FILE</span>
          }

          <span class="attachment-info">
            <span class="attachment-name">{{ file.name }}</span>
            <span class="attachment-size">{{ formatFileSize(file.size) }}</span>
          </span>

          <button
            type="button"
            class="attachment-remove"
            (click)="removeFile(file.id)"
            [attr.aria-label]="'Quitar ' + file.name"
          >
            x
          </button>
        </div>
      }
    </div>
  }

  <div class="chat-input-bar d-flex gap-2 align-items-center">
    <!-- Boton Emojis -->
    <button type="button" class="chat-input-icon btn btn-outline-secondary rounded-circle p-2">
      &#9786;
    </button>

    <!-- Input Mensaje -->
    <input
      type="text"
      [(ngModel)]="userMessage"
      class="form-control rounded-pill"
      placeholder="Escribe un mensaje..."
      (keyup.enter)="sendMessage()"
      [disabled]="isLoading"
    />

    <input
      #fileInput
      type="file"
      class="visually-hidden"
      multiple
      (change)="onFileSelected($event)"
    />

    <!-- Boton Adjuntar Archivo -->
    <button
      type="button"
      class="chat-input-icon btn btn-outline-secondary rounded-circle p-2"
      (click)="openFilePicker()"
      [disabled]="isLoading"
      aria-label="Adjuntar archivo"
      title="Adjuntar archivo"
    >
      <img src="/assets/images/add-file.png" alt="Adjuntar Archivo" class="chat-input-icon-img">
    </button>

    <!-- Boton Enviar -->
    <button
      type="button"
      class="chat-input-icon btn btn-primary rounded-circle p-2"
      (click)="sendMessage()"
      [disabled]="isLoading || (!userMessage.trim() && attachedFileViews.length === 0)"
      aria-label="Enviar mensaje"
      title="Enviar mensaje"
    >
      &#10148;
    </button>
  </div>
</div>
