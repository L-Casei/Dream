<div class="d-flex" style="height: 100vh;">

    <!-- SIDEBAR (izquierda) -->
    <aside class="bg-dark text-white" style="width: 280px; flex-shrink: 0;">
        <app-sidebar></app-sidebar>
    </aside>

    <!-- CHAT PRINCIPAL (derecha) -->
    <div class="flex-grow-1 d-flex flex-column">

        <!-- HEADER -->
        <header class="p-3 border-bottom">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Chat Bot - Dream</h4>
                <div class="d-flex">
                    <!-- ... -->
                    <button class="btn btn-outline-light btn-sm" (click)="toggleTheme()">
                        {{ (isDarkMode$ | async) ? '🌙' : '☀️' }}
                    </button>
                    <!-- ... -->
                </div>
            </div>
        </header>

        <!-- MESSAGE LIST -->
        <main class="flex-grow-1 overflow-auto p-4" 
              [style.backgroundImage]="(isDarkMode$ | async) ? 'url(assets/images/whitehole.jpg)' : 'url(assets/images/whitetree.jpg)'"
              style="background-position: center; background-size: cover; background-repeat: no-repeat; max-width: 100%; max-height: 100%;">
              
            <app-message-list></app-message-list>
        </main>

        <!-- CHAT INPUT -->
        <footer class="border-top p-4 align-items-center ">
            <app-chat-input></app-chat-input>
        </footer>

    </div>

</div>
