<div class="chat-shell d-flex">

    <!-- SIDEBAR (izquierda) -->
    <aside class="app-sidebar-shell">
        <app-sidebar></app-sidebar>
    </aside>

    <!-- CHAT PRINCIPAL (derecha) -->
    <div class="flex-grow-1 d-flex flex-column">

        <!-- HEADER -->
        <header class="p-3 border-bottom">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Dream AI</h4>
                <div class="d-flex">
                    <!-- ... -->
                    <button class="btn btn-outline-light btn-sm" (click)="toggleTheme()">
                        {{ (isDarkMode$ | async) ? '🌙' : '☀️' }}
                    </button>
                    <!-- ... -->
                </div>
            </div>
        </header>

        <!-- MESSAGE LIST -->
        <main class="chat-main flex-grow-1 overflow-auto p-4" 
              [style.backgroundImage]="(isDarkMode$ | async) ? 'url(assets/images/blackhole.png)' : 'url(assets/images/whitehole.png)'"
        >
              
            <app-message-list></app-message-list>
        </main>

        <!-- CHAT INPUT -->
        <footer class="border-top p-4 align-items-center ">
            <app-chat-input></app-chat-input>
        </footer>

    </div>

</div>
