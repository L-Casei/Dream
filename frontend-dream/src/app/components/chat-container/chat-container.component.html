@let isDarkMode = (isDarkMode$ | async) === true;

<div class="chat-shell d-flex">
    <!-- Aside (izquierda) -->
    <aside class="app-aside-shell" [class.aside-collapsed]="isAsideCollapsed">
        <button
            type="button"
            class="aside-toggle"
            [class.aside-toggle-collapsed]="isAsideCollapsed"
            (click)="toggleAside()"
            [attr.aria-label]="isAsideCollapsed ? 'Mostrar panel lateral' : 'Ocultar panel lateral'"
        >
            <span class="aside-toggle-icon">&lsaquo;</span>
        </button>

        <div class="aside-content">
            <app-aside [collapsed]="isAsideCollapsed"></app-aside>
        </div>
    </aside>

    <!-- CHAT PRINCIPAL (derecha) -->
    <div class="flex-grow-1 d-flex flex-column">

        <!-- HEADER -->
        <header class="p-3 border-bottom">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Dream AI</h4>
                <div class="d-flex">
                    <button
                        type="button"
                        class="theme-toggle"
                        [class.theme-toggle-dark]="isDarkMode"
                        (click)="toggleTheme()"
                        [attr.aria-label]="isDarkMode ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
                    >
                        <span class="theme-toggle-icon theme-toggle-sun">&#9728;</span>
                        <span class="theme-toggle-icon theme-toggle-moon">&#9790;</span>
                        <span class="theme-toggle-thumb"></span>
                    </button>
                </div>
            </div>
        </header>

        <!-- MESSAGE LIST -->
        <main class="chat-main flex-grow-1 overflow-auto p-4" 
              [style.backgroundImage]="isDarkMode ? 'url(assets/images/blackhole.png)' : 'url(assets/images/whitehole.png)'"
        >
              
            <app-message-list></app-message-list>
        </main>

        <!-- CHAT INPUT -->
        <footer class="border-top p-4 align-items-center ">
            <app-chat-input></app-chat-input>
        </footer>

    </div>

</div>
